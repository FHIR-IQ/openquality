name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  validate-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Every package reaches Level 1
        run: pnpm oq validate-all measures/cms-fhir-2026 measures/community
      - name: The contributor template still reaches Level 1
        # measures/TEMPLATE is the skeleton CONTRIBUTING tells people to copy,
        # and its README claims it validates as-is. It sits directly under
        # measures/ rather than inside a collection, so it is the only package
        # this root finds, and it stays out of the corpus count and the library.
        # Checked because a template that silently stops passing sends every new
        # contributor into a failing build.
        run: pnpm oq validate-all measures --floor 1
      - name: No licensed display text
        run: |
          if grep -rn 'from "CPT"' measures/ | grep -q display; then
            echo "CPT display text found in measures/"
            grep -rn 'from "CPT"' measures/ | grep display
            exit 1
          fi

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the upstream tarball
        uses: actions/cache@v4
        with:
          path: .cache
          key: upstream-d4e0edd01b7da2a3b43d5360156b43761438190a
      - name: Re-run the importer
        # The date must match what is recorded in the committed packages, or
        # every provenance block differs and the diff is noise.
        run: pnpm oq-import 2026-08-01
      # git status rather than git diff, throughout this job. `git diff` only
      # compares tracked files, so a generated file the commit does not contain
      # is invisible to it and the check passes while the tree is wrong. That is
      # the same fail-open shape as knowledge/corpus/2026-004 and 2026-005: a
      # check that answers "did I find a difference?" quietly answers no when it
      # should answer "I was not looking there."
      - name: Committed tree must equal importer output
        run: |
          if [ -n "$(git status --porcelain -- measures/)" ]; then
            echo "The committed corpus differs from what the importer produces."
            echo "Generated packages must not be edited by hand: change the importer"
            echo "in packages/importer and re-run 'pnpm oq-import 2026-08-01'."
            echo ""
            git status --short -- measures/
            git diff -- measures/
            exit 1
          fi
      - name: Re-run the library build
        run: pnpm build-library
      - name: Committed site pages must equal generator output
        # The library states counts and provenance for every package, each
        # knowledge entry has its own citable page, and the sitemap lists them.
        # If any of it can drift from the corpus it describes, it becomes a
        # claim nobody checks, which is the one thing this project cannot ship.
        #
        # Catching an untracked file matters most here: a contributor who adds a
        # knowledge entry without running the generator leaves the entry with no
        # page, and a check that only diffed tracked files would call that fine.
        # Paths are written out rather than held in a variable: an unquoted
        # expansion relies on word splitting, which bash does and other shells
        # do not, so it cannot be checked locally on a Mac.
        run: |
          if [ -n "$(git status --porcelain -- site/library.html site/library.js site/knowledge site/sitemap.xml site/index.json)" ]; then
            echo "The committed site pages differ from the generator output."
            echo "Do not edit them by hand: run 'pnpm build-library' and commit the result."
            echo ""
            git status --short -- site/library.html site/library.js site/knowledge site/sitemap.xml site/index.json
            git diff -- site/library.html site/library.js site/knowledge site/sitemap.xml site/index.json
            exit 1
          fi
